<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Venta de Camisetas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #333;
    }
    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
      padding-bottom: 15px;
    }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }
    .card h3 {
      margin: 10px 0 5px;
    }
    .price {
      font-weight: bold;
      margin-bottom: 10px;
    }
    .btn {
      display: inline-block;
      background: #111;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      transition: 0.2s;
    }
    .btn:hover {
      background: #444;
    }
    footer {
      text-align: center;
      padding: 15px;
      background: #eaeaea;
      margin-top: 30px;
    }
  </style>
</head>
<body>

<header>
  <h1>Mi tienda de camisetas</h1>
  <p>Camisetas personalizadas y de buena calidad</p>
</header>

<section class="container">
  <div class="card">
    <img src="https://via.placeholder.com/300x220" alt="Camiseta 1">
    <h3>Camiseta Negra</h3>
    <p class="price">$10.000</p>
    <a class="btn" href="https://wa.me/XXXXXXXXXX" target="_blank">Comprar</a>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300x220" alt="Camiseta 2">
    <h3>Camiseta Blanca</h3>
    <p class="price">$9.000</p>
    <a class="btn" href="https://wa.me/XXXXXXXXXX" target="_blank">Comprar</a>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300x220" alt="Camiseta 3">
    <h3>Camiseta Estampada</h3>
    <p class="price">$12.000</p>
    <a class="btn" href="https://wa.me/XXXXXXXXXX" target="_blank">Comprar</a>
  </div>
</section>

<footer>
  <p>Contacto: tucorreo@email.com | Instagram: @tutienda</p>
</footer>

</body>
</html>
